version: '3.8'

# Production configuration with external services
# Use this when you have external PostgreSQL, Redis, and RabbitMQ

services:
  carter-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: carter-api
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - PORT=8080
      - ENV=production
    restart: unless-stopped
    networks:
      - carter-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  carter-network:
    driver: bridge
