name: Crud Service Deploy

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/alkush-pipania/carter-go

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p /home/ubuntu/deploy

            cat > /home/ubuntu/deploy/.env <<EOF
            DB_URL=${{ secrets.DB_URL }}
            REDIS_URL=${{ secrets.REDIS_URL }}
            RABBITMQ_URL=${{ secrets.RABBITMQ_URL }}
            EXCHANGE_NAME=${{ secrets.EXCHANGE_NAME }}
            QUEUE_NAME=${{ secrets.QUEUE_NAME }}
            WORKER_COUNT=${{ secrets.WORKER_COUNT }}
            DO_REGION=${{ secrets.DO_REGION }}
            DO_ENDPOINT=${{ secrets.DO_ENDPOINT }}
            DO_ACCESS_KEY=${{ secrets.DO_ACCESS_KEY }}
            DO_SECRET_KEY=${{ secrets.DO_SECRET_KEY }}
            DO_BUCKET=${{ secrets.DO_BUCKET }}
            DELETE_QUEUE_NAME=${{ secrets.DELETE_QUEUE_NAME }}
            DELETE_ROUTING_KEY=${{ secrets.DELETE_ROUTING_KEY }}
            PORT=8080
            ENV=production
            LOG_LEVEL=info
            EOF

            chmod 600 /home/ubuntu/deploy/.env

            docker network inspect scraper_scrapper-network >/dev/null 2>&1 || docker network create scraper_scrapper-network

            docker pull ${{ env.IMAGE_NAME }}:latest
            if docker ps -a --format '{{.Names}}' | grep -q '^crud-api$'; then
              docker rm -f crud-api
            fi

            docker run -d --name crud-api \
              --network scraper_scrapper-network \
              --env-file /home/ubuntu/deploy/.env \
              -p 127.0.0.1:8080:8080 \
              --restart=always \
              ${{ env.IMAGE_NAME }}:latest
