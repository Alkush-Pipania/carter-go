name: Crud Service Deploy

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/alkush-pipania/carter-go   # <-- LOWERCASE ONLY

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p /home/ec2-user/deploy

            cat > /home/ec2-user/deploy/.env <<EOF
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            REDIS_URL=${{ secrets.REDIS_URL }}
            RABBITMQ_URL=${{ secrets.RABBITMQ_URL }}
            PORT=8080
            EOF

            chmod 600 /home/ec2-user/deploy/.env

            docker pull ${{ env.IMAGE_NAME }}:latest
            docker rm -f scrapper-api || true

            docker run -d --name scrapper-api \
              --env-file /home/ec2-user/deploy/.env \
              -p 127.0.0.1:8080:8080 \
              --restart=always \
              ${{ env.IMAGE_NAME }}:latest
              
          
